<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DThu QuizMaster - Hệ Thống Ôn Tập & Thi Trắc Nghiệm Đại Học Đồng Tháp</title>
  <meta name="description" content="Nền tảng ôn thi trắc nghiệm khách quan trực tuyến dành cho sinh viên Trường Đại học Đồng Tháp. Hỗ trợ đa môn học, thi thử bấm giờ, phân tích câu hỏi tự động và ngân hàng câu sai.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/views.css">
</head>
<body>

  <!-- Floating Toast Notification Container (Góc trên bên phải) -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Global Header -->
  <header class="app-header" id="appHeader"></header>

  <!-- Main Dynamic View Container -->
  <main id="mainContent" class="app-main"></main>

  <!-- Floating Draggable Guide Button (Nút Nổi Kéo Thả Hút Cạnh) -->
  <button class="floating-guide-btn" id="floatingGuideBtn" title="💡 Nhấp để xem Hướng dẫn · Nhấn giữ để kéo thả">
    <span class="guide-btn-icon">💡</span>
    <span class="guide-btn-text">Hướng dẫn</span>
    <span class="guide-btn-drag-handle" title="Kéo thả">⠿</span>
  </button>

  <!-- User Side Drawer (Thanh Trượt Bên Phải) -->
  <div class="drawer-overlay" id="userDrawerOverlay" onclick="App.closeUserDrawer()"></div>
  <aside class="user-drawer" id="userDrawer">
    <div class="drawer-header">
      <h3>👤 Trung Tâm Cá Nhân</h3>
      <button class="drawer-close" onclick="App.closeUserDrawer()">&times;</button>
    </div>
    <div class="drawer-body" id="userDrawerBody"></div>
    <div class="drawer-footer" id="userDrawerFooter"></div>
  </aside>

  <!-- Global Modal Popup -->
  <div class="modal-overlay" id="globalModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Tiêu đề</h3>
        <button class="modal-close" onclick="App.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Global Footer (Tự động ẩn/hiện theo router, chỉ hiển thị ở Trang Chủ) -->
  <footer class="app-footer" id="appFooter" style="display: none;">
    <div class="footer-container">
      <div class="footer-bottom">
        <div class="footer-copyright">
          © 2026 <strong>DThu QuizMaster</strong> · Trường Đại học Đồng Tháp. Phát triển bởi <strong>Bùi Văn Khang</strong> (Lớp ĐHCNSH24A · Khoa Kỹ thuật - Công nghệ).
        </div>
        <div class="footer-bottom-links">
          <a href="javascript:void(0)" onclick="App.openContactModal()">📩 Góp Ý Hệ Thống</a>
          <span>·</span>
          <a href="javascript:void(0)" onclick="App.openForgotPasswordModal()">❓ Quên Mã PIN</a>
          <span>·</span>
          <a href="javascript:void(0)" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">Về Đầu Trang ↑</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Core JavaScript Modules (Tuần tự để hỗ trợ chạy file:// offline) -->
  <script src="assets/js/services/api-config.js"></script>
  <script src="assets/js/services/supabase-client.js"></script>
  <script src="assets/js/data/default-banks.js"></script>
  <script src="assets/js/services/data-loader.js"></script>
  <script src="assets/js/services/storage.js"></script>
  <script src="assets/js/services/email.js"></script>
  <script src="assets/js/services/quiz-engine.js"></script>
  <script src="assets/js/services/import-export.js"></script>
  <script src="assets/js/services/parser.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
